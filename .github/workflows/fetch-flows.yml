name: 수급(KIS) 수집 — 비활성(맥미니 launchd로 이관)
# 2026-09: 네이버 수급 iframe 폐지 → 한국투자증권 OpenAPI 로 교체.
# KIS 키가 맥미니 로컬 .env 에만 있어, 수집은 맥미니 launchd(com.anda.flows, 평일 15:45 KST)로 이관.
# 이 워크플로는 수동 실행용으로만 남겨둠(사용하려면 KIS_APP_KEY/KIS_APP_SECRET 시크릿 필요).
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install deps
        working-directory: scripts
        run: npm install
      - name: Fetch
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: node fetch-flows.mjs
