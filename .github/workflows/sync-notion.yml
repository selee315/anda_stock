name: Notion → Supabase 동기화

on:
  workflow_dispatch:            # 수동 실행 (Actions 탭에서 Run)
    inputs:
      full:
        description: "전체 재수집 (본문 재구성). 평소엔 체크 해제 = 증분"
        type: boolean
        default: false
  schedule:
    - cron: "0 */6 * * *"       # 6시간마다 자동 동기화 (증분이라 가벼움)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        working-directory: scripts
        run: npm install
      - name: Run sync
        working-directory: scripts
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FULL_SYNC: ${{ github.event.inputs.full }}
        run: node sync-notion.mjs
