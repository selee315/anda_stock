name: DART 국내공시 수집

# 2026-10: GitHub 시크릿(DART_API_KEY) 문제로 CI 실패 → 맥미니 launchd(com.anda.dart,
# 평일 9:30·12:30·15:30·18:30)로 이관. 이 워크플로는 수동 실행용으로만 남겨둠.
on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        working-directory: scripts
        run: npm install
      - name: Fetch DART disclosures
        working-directory: scripts
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DART_DAYS: "2"
        run: node fetch-dart.mjs
