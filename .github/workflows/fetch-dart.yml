name: DART 국내공시 수집

on:
  workflow_dispatch:            # 수동 실행 (Actions 탭에서 Run)
  schedule:
    - cron: "0 */3 * * *"       # 3시간마다 (DART 하루 2만콜 여유 · 접수번호 PK로 중복제거)

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        working-directory: scripts
        run: npm install
      - name: Fetch DART disclosures
        working-directory: scripts
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DART_DAYS: "2"
        run: node fetch-dart.mjs
